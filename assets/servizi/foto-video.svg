<svg xmlns="http://www.w3.org/2000/svg" width="470" height="172" viewBox="0 0 470 172" role="img" aria-label="Foto, Video e 3D">
<defs>
  
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.03)"/>
  </pattern>
  <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3e6aff" stop-opacity="0.085"/>
    <stop offset="42%" stop-color="#3e6aff" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
</defs>
  <!-- Nessuna animazione d'ingresso: una scheda che parte da opacity 0 e
       si accende con un'animazione e' una scheda che, se per qualsiasi
       motivo l'animazione non parte (anteprima social, lettore che non
       esegue SMIL, screenshot), resta invisibile. Il rischio non vale
       mezzo secondo di dissolvenza. -->
  <g>
    <rect x="0.5" y="0.5" width="469" height="171" rx="14" fill="#0c0e13" stroke="rgba(255,255,255,0.08)"/>
    <rect x="1" y="1" width="468" height="170" rx="13" fill="url(#grid)"/>
    <rect x="1" y="1" width="468" height="170" rx="13" fill="url(#acc)"/>

    <rect x="0" y="16" width="13" height="140" fill="#3e6aff" opacity="0.55" filter="url(#soft)"/>
    <rect x="0" y="16" width="3" height="140" fill="#3e6aff"/>

    <text x="26" y="36" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="1.6"
          fill="#5a5a66">// 08</text>
    <text x="444" y="37" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16"
          fill="#3e6aff">→</text>

    <text x="26" y="70" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19.5" font-weight="600"
          letter-spacing="-0.3" fill="#f2f2f4">Foto, Video e 3D</text>

    <text x="26" y="98" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8a8a96">Contenuti consegnati già ottimizzati per il peso e</text>
    <text x="26" y="116" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8a8a96">i formati del tuo sito.</text>

    <g transform="translate(26.0,0)">
      <rect x="0.5" y="130.5" width="46.4" height="23" rx="11.5" fill="#12151c" stroke="rgba(255,255,255,0.08)"/>
      <text x="23.2" y="145.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11"
            fill="#8a8a96">Foto</text>
    </g>
    <g transform="translate(80.4,0)">
      <rect x="0.5" y="130.5" width="53.0" height="23" rx="11.5" fill="#12151c" stroke="rgba(255,255,255,0.08)"/>
      <text x="26.5" y="145.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11"
            fill="#8a8a96">Video</text>
    </g>
    <g transform="translate(141.4,0)">
      <rect x="0.5" y="130.5" width="53.0" height="23" rx="11.5" fill="#12151c" stroke="rgba(255,255,255,0.08)"/>
      <text x="26.5" y="145.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11"
            fill="#8a8a96">Drone</text>
    </g>
    <g transform="translate(202.4,0)">
      <rect x="0.5" y="130.5" width="33.2" height="23" rx="11.5" fill="#12151c" stroke="rgba(255,255,255,0.08)"/>
      <text x="16.6" y="145.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11"
            fill="#8a8a96">3D</text>
    </g>
  </g>
</svg>
