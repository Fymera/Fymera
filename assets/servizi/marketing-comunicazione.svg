<svg xmlns="http://www.w3.org/2000/svg" width="470" height="172" viewBox="0 0 470 172" role="img" aria-label="Marketing e Comunicazione">
<defs>
  
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.03)"/>
  </pattern>
  <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#586ffa" stop-opacity="0.085"/>
    <stop offset="42%" stop-color="#586ffa" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
</defs>
  <!-- Nessuna animazione d'ingresso: una scheda che parte da opacity 0 e
       si accende con un'animazione e' una scheda che, se per qualsiasi
       motivo l'animazione non parte (anteprima social, lettore che non
       esegue SMIL, screenshot), resta invisibile. Il rischio non vale
       mezzo secondo di dissolvenza. -->
  <g>
    <rect x="0.5" y="0.5" width="469" height="171" rx="14" fill="#0c0e13" stroke="rgba(255,255,255,0.08)"/>
    <rect x="1" y="1" width="468" height="170" rx="13" fill="url(#grid)"/>
    <rect x="1" y="1" width="468" height="170" rx="13" fill="url(#acc)"/>

    <rect x="0" y="16" width="13" height="140" fill="#586ffa" opacity="0.55" filter="url(#soft)"/>
    <rect x="0" y="16" width="3" height="140" fill="#586ffa"/>

    <text x="26" y="36" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="1.6"
          fill="#5a5a66">// 06</text>
    <text x="444" y="37" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16"
          fill="#586ffa">→</text>

    <text x="26" y="70" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19.5" font-weight="600"
          letter-spacing="-0.3" fill="#f2f2f4">Marketing e Comunicazione</text>

    <text x="26" y="98" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8a8a96">Il tracciamento prima della spesa: sai quali</text>
    <text x="26" y="116" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8a8a96">contatti arrivano e quanto costa ognuno.</text>

    <g transform="translate(26.0,0)">
      <rect x="0.5" y="130.5" width="39.8" height="23" rx="11.5" fill="#12151c" stroke="rgba(255,255,255,0.08)"/>
      <text x="19.9" y="145.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11"
            fill="#8a8a96">GA4</text>
    </g>
    <g transform="translate(73.8,0)">
      <rect x="0.5" y="130.5" width="92.6" height="23" rx="11.5" fill="#12151c" stroke="rgba(255,255,255,0.08)"/>
      <text x="46.3" y="145.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11"
            fill="#8a8a96">Server-side</text>
    </g>
    <g transform="translate(174.4,0)">
      <rect x="0.5" y="130.5" width="39.8" height="23" rx="11.5" fill="#12151c" stroke="rgba(255,255,255,0.08)"/>
      <text x="19.9" y="145.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11"
            fill="#8a8a96">SEO</text>
    </g>
    <g transform="translate(222.2,0)">
      <rect x="0.5" y="130.5" width="39.8" height="23" rx="11.5" fill="#12151c" stroke="rgba(255,255,255,0.08)"/>
      <text x="19.9" y="145.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11"
            fill="#8a8a96">Ads</text>
    </g>
  </g>
</svg>
